name: gaayana
description: Gaayana — cross-platform music player (Flutter) with background playback, offline downloads, infinity radio, playlists, favorites.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter

  # State & routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Audio
  just_audio: ^0.9.40
  audio_service: ^0.18.15
  audio_session: ^0.1.21

  # Library scan / file IO
  on_audio_query: ^2.9.0
  file_picker: ^8.0.5
  permission_handler: ^11.3.1
  path_provider: ^2.1.3
  path: ^1.9.0

  # Local DB & prefs
  sqflite: ^2.3.3
  shared_preferences: ^2.2.3

  # Networking
  dio: ^5.5.0+1
  connectivity_plus: ^6.0.3

  # Theming
  dynamic_color: ^1.7.0
  palette_generator: ^0.3.3+4

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.3
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1

  # Downloads
  flutter_downloader: ^1.11.7

  # Misc
  share_plus: ^9.0.0
  cached_network_image: ^3.3.1
  marquee: ^2.2.3
  uuid: ^4.4.0
  collection: ^1.18.0
  rxdart: ^0.27.7

  # Optional / platform features (loaded lazily)
  home_widget: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/logo/gaayana_logo_square.png"
  adaptive_icon_background: "#5B21B6"
  adaptive_icon_foreground: "assets/logo/gaayana_logo_foreground.png"
  remove_alpha_ios: true
